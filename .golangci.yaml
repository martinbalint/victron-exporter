version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - gochecknoinits
    - gomodguard
    - goconst
    - ireturn
    - mnd
    - noinlineerr
    - nolintlint
    - testpackage
    - unparam
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 16
    gocognit:
      min-complexity: 16
    gocyclo:
      min-complexity: 16
    lll:
      line-length: 160
      tab-width: 4
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
